; Copy to /etc/supervisor/conf.d/meher-queue.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start meher-queue:*
[program:meher-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/meher/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/meher/storage/logs/queue.log
stopwaitsecs=3600
