# Copy to /etc/nginx/sites-available/meher, symlink into sites-enabled, then run certbot (see docs/DEPLOYMENT.md).
# Replace example.com, the project path and the PHP-FPM socket (ls /run/php).
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/meher/public;
    index index.php;
    charset utf-8;

    # Image uploads are limited to 2 MB each in the app; leave some room.
    client_max_body_size 8M;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files: served as plain files, never executed as PHP.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fingerprinted build files can be cached for a year.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve hidden files (.env, .git), except Let's Encrypt's challenge folder.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
